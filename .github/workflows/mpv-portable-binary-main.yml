name: Build MPV with libmpv

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-mpv:
    runs-on: ubuntu-latest
    container: fedora:latest          # or fedora:rawhide
    env:
      SOURCE_DIR: mpv-build
      BUILD_DIR: build
      INSTALL_DIR: ${{ github.workspace }}/mpv-install

    steps:
    - name: Install build dependencies
      run: |
        dnf -y update
        dnf -y install \
          gcc gcc-c++ make meson ninja-build pkgconf-pkg-config \
          git wget patchelf zip \
          ffmpeg-devel libass-devel libbluray-devel \
          libdvdnav-devel libdvdread-devel libcdio-paranoia-devel \
          alsa-lib-devel libva-devel libvdpau-devel \
          libX11-devel libXext-devel libXScrnSaver-devel libXpresent-devel \
          libXrandr-devel libXinerama-devel \
          libglvnd-devel mesa-libEGL-devel mesa-libGL-devel mesa-libGLES-devel \
          wayland-devel wayland-protocols libxkbcommon-devel \
          lua-devel mujs-devel libjpeg-turbo-devel libpng-devel \
          freetype-devel fontconfig-devel lcms2-devel uchardet-devel \
          openal-soft-devel libsndio-devel pipewire-devel \
          libarchive-devel vulkan-devel python3-devel \
          mesa-vulkan-drivers

    - name: Clone mpv
      run: |
        git clone --depth 1 --branch master https://github.com/mpv-player/mpv.git ${{ env.SOURCE_DIR }}

    - name: Clone libplacebo as meson subproject (static)
      run: |
        mkdir -p ${{ env.SOURCE_DIR }}/subprojects
        git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git \
          ${{ env.SOURCE_DIR }}/subprojects/libplacebo

    - name: Configure with Meson
      run: |
        cd ${{ env.SOURCE_DIR }}
        meson setup ${{ env.BUILD_DIR }} \
          --prefix=${{ env.INSTALL_DIR }} \
          -Dbuildtype=release \
          -Dlibmpv=true \
          -Dlua=enabled \
          -Djavascript=enabled \
          -Dlibarchive=enabled \
          -Dlibbluray=enabled \
          -Ddvbin=enabled \
          -Ddvdnav=enabled \
          -Dcdda=enabled \
          -Duchardet=enabled \
          -Dlcms2=enabled \
          -Dpulse=disabled \
          -Dalsa=enabled \
          -Dpipewire=enabled \
          -Dvaapi=enabled \
          -Dvdpau=enabled \
          -Dwayland=disabled \
          -Dx11=enabled \
          -Dgl=enabled \
          -Degl=enabled \
          -Dopenal=enabled \
          -Dsndio=enabled \
          -Dvulkan=enabled

    - name: Compile
      run: |
        cd ${{ env.SOURCE_DIR }}
        meson compile -C ${{ env.BUILD_DIR }}

    - name: Install
      run: |
        cd ${{ env.SOURCE_DIR }}
        meson install -C ${{ env.BUILD_DIR }}

    - name: Bundle shared libraries
      run: |
        mkdir -p ${{ env.INSTALL_DIR }}/lib
        # Core / driver / audio / X11 libraries we deliberately leave on the host
        EXCLUDE="libc.so libm.so libpthread.so librt.so libdl.so ld-linux-x86-64.so libutil.so libresolv.so libcrypt.so libnss_ libgcc_s.so libstdc++.so libasound.so libopenal.so libpipewire libsndio.so libX11.so libXss.so libXpresent.so libXext.so libXrandr.so libXinerama.so libvulkan.so libva.so libva-drm.so libva-x11.so libva-wayland.so libvdpau.so libGL.so libGLX.so libGLdispatch.so libEGL.so libGLES libdrm.so libgbm.so"
        FILES="${{ env.INSTALL_DIR }}/bin/mpv ${{ env.INSTALL_DIR }}/lib/libmpv.so*"
        for file in $FILES; do
          [ -f "$file" ] || continue
          ldd "$file" | grep '=>' | awk '{print $3}' | sort -u | while read libpath; do
            [ -f "$libpath" ] || continue
            base=$(basename "$libpath")
            if echo "$EXCLUDE" | grep -qw "$base"; then
              echo "Skipping excluded library: $base"
            else
              cp -Lf "$libpath" "${{ env.INSTALL_DIR }}/lib/$base" && chmod 755 "${{ env.INSTALL_DIR }}/lib/$base"
            fi
          done
        done
        # recursive pass
        changed=1
        while [ "$changed" = "1" ]; do
          changed=0
          for so in ${{ env.INSTALL_DIR }}/lib/*.so*; do
            [ -f "$so" ] || continue
            ldd "$so" | grep '=>' | awk '{print $3}' | sort -u | while read libpath; do
              [ -f "$libpath" ] || continue
              base=$(basename "$libpath")
              if echo "$EXCLUDE" | grep -qw "$base"; then
                echo "Skipping excluded library: $base"
              elif [ ! -f "${{ env.INSTALL_DIR }}/lib/$base" ]; then
                cp -Lf "$libpath" "${{ env.INSTALL_DIR }}/lib/$base" && chmod 755 "${{ env.INSTALL_DIR }}/lib/$base"
                changed=1
              fi
            done
          done
        done

    - name: Remove accidentally bundled core libraries
      run: |
        rm -fv ${{ env.INSTALL_DIR }}/lib/libc.so.* \
               ${{ env.INSTALL_DIR }}/lib/libm.so.* \
               ${{ env.INSTALL_DIR }}/lib/libpthread.so.* \
               ${{ env.INSTALL_DIR }}/lib/librt.so.* \
               ${{ env.INSTALL_DIR }}/lib/libdl.so.* \
               ${{ env.INSTALL_DIR }}/lib/libutil.so.* \
               ${{ env.INSTALL_DIR }}/lib/libresolv.so.* \
               ${{ env.INSTALL_DIR }}/lib/libcrypt.so.* \
               ${{ env.INSTALL_DIR }}/lib/libnss_* \
               ${{ env.INSTALL_DIR }}/lib/ld-linux-x86-64.so.* \
               ${{ env.INSTALL_DIR }}/lib/libgcc_s.so.* \
               ${{ env.INSTALL_DIR }}/lib/libstdc++.so.* \
               ${{ env.INSTALL_DIR }}/lib/libanl.so.* \
               ${{ env.INSTALL_DIR }}/lib/libBrokenLocale.so.* \
               ${{ env.INSTALL_DIR }}/lib/libthread_db.so.* \
               ${{ env.INSTALL_DIR }}/lib/libmemusage.so.* \
               ${{ env.INSTALL_DIR }}/lib/libpcprofile.so.* \
               ${{ env.INSTALL_DIR }}/lib/libSegFault.so.*

    - name: Create launcher
      run: |
        mv ${{ env.INSTALL_DIR }}/bin/mpv ${{ env.INSTALL_DIR }}/bin/mpv.bin
        cat << 'EOF' > ${{ env.INSTALL_DIR }}/bin/mpv
        #!/bin/sh
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LD_LIBRARY_PATH="${SCRIPT_DIR}/../lib${LD_LIBRARY_PATH:+:}${LD_LIBRARY_PATH}"
        exec "${SCRIPT_DIR}/mpv.bin" "$@"
        EOF
        chmod +x ${{ env.INSTALL_DIR }}/bin/mpv

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mpv-install
        path: ${{ env.INSTALL_DIR }}
        retention-days: 30
